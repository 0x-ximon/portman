name-template: "Portman v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Upgrades"
    semver-increment: "major"
    when:
      labels:
        - "breaking"
        - "major"

  - title: "Features"
    semver-increment: "major"
    when:
      labels:
        - "feat"
        - "minor"

  - title: "Improvements"
    semver-increment: "patch"
    when:
      labels:
        - "fix"
        - "perf"
        - "test"
        - "chore"
        - "refactor"
        - "patch"

  - type: "pre-exclude"
    when:
      label: "skip-changelog"

template: |
  <Accordions>
    $CHANGES
  </Accordions>

category-template: |
  <Accordion title="$TITLE">
    $ENTRIES
  </Accordion>

change-template: "- $TITLE ([#$NUMBER]($URL)) by @$AUTHOR"
