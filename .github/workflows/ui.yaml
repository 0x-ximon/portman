name: UI [Rust]

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ui

        steps:
            - uses: actions/checkout@v5

            - name: Build
              run: cargo build --verbose

            - name: Run tests
              run: cargo test --verbose
